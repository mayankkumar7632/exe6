<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - CS Dept</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav class="navbar">
    <a href="../" class="logo">CS <span>Dept</span></a>
    <ul class="nav-links">
      <li><a href="../">Home</a></li>
      <li><a href="../pages/about.html">About</a></li>
    </ul>
    <div class="nav-auth" id="nav-auth"></div>
  </nav>

  <div class="form-container">
    <div class="form-card">
      <h2>Create Account</h2>
      <p class="subtitle">Register for the department portal</p>

      <div class="alert alert-error" id="error-msg"></div>
      <div class="alert alert-success" id="success-msg"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="John Doe" required />
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Min 6 characters" minlength="6" required />
        </div>
        <div class="form-group">
          <label for="department">Department</label>
          <select id="department" required>
            <option value="">Select Department</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Electronics">Electronics & Communication</option>
            <option value="Mechanical">Mechanical Engineering</option>
            <option value="Civil">Civil Engineering</option>
          </select>
        </div>
        <div class="form-group">
          <label for="role">Role</label>
          <select id="role" required>
            <option value="student">Student</option>
            <option value="faculty">Faculty</option>
          </select>
        </div>
        <button type="submit" class="btn btn-success" id="register-btn">Create Account</button>
      </form>

      <div class="form-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 Department of Computer Science. All rights reserved.</p>
  </footer>

  <script src="../js/main.js"></script>
  <script>
    const form = document.getElementById("register-form");
    const errorMsg = document.getElementById("error-msg");
    const successMsg = document.getElementById("success-msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.style.display = "none";
      successMsg.style.display = "none";

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const department = document.getElementById("department").value;
      const role = document.getElementById("role").value;
      const btn = document.getElementById("register-btn");

      btn.textContent = "Creating account...";
      btn.disabled = true;

      try {
        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ fullName, email, password, department, role }),
        });

        const data = await res.json();

        if (!data.success) {
          errorMsg.textContent = data.message;
          errorMsg.style.display = "block";
        } else {
          setUser(data.user);
          successMsg.textContent = "Registration successful! Redirecting...";
          successMsg.style.display = "block";
          setTimeout(() => (window.location.href = "../"), 1200);
        }
      } catch (err) {
        errorMsg.textContent = "Network error. Please try again.";
        errorMsg.style.display = "block";
      }

      btn.textContent = "Create Account";
      btn.disabled = false;
    });

    if (getUser()) window.location.href = "../";
  </script>
</body>
</html>
