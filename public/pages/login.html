<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - CS Dept</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav class="navbar">
    <a href="../" class="logo">CS <span>Dept</span></a>
    <ul class="nav-links">
      <li><a href="../">Home</a></li>
      <li><a href="../pages/about.html">About</a></li>
    </ul>
    <div class="nav-auth" id="nav-auth"></div>
  </nav>

  <div class="form-container">
    <div class="form-card">
      <h2>Welcome Back</h2>
      <p class="subtitle">Sign in to your account</p>

      <div class="alert alert-error" id="error-msg"></div>
      <div class="alert alert-success" id="success-msg"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required />
        </div>
        <button type="submit" class="btn btn-primary" id="login-btn">Sign In</button>
      </form>

      <div class="form-footer">
        Don't have an account? <a href="register.html">Register here</a>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 Department of Computer Science. All rights reserved.</p>
  </footer>

  <script src="../js/main.js"></script>
  <script>
    const form = document.getElementById("login-form");
    const errorMsg = document.getElementById("error-msg");
    const successMsg = document.getElementById("success-msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.style.display = "none";
      successMsg.style.display = "none";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("login-btn");

      btn.textContent = "Signing in...";
      btn.disabled = true;

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (!data.success) {
          errorMsg.textContent = data.message;
          errorMsg.style.display = "block";
        } else {
          setUser(data.user);
          successMsg.textContent = "Login successful! Redirecting...";
          successMsg.style.display = "block";
          setTimeout(() => (window.location.href = "../"), 1000);
        }
      } catch (err) {
        errorMsg.textContent = "Network error. Please try again.";
        errorMsg.style.display = "block";
      }

      btn.textContent = "Sign In";
      btn.disabled = false;
    });

    if (getUser()) window.location.href = "../";
  </script>
</body>
</html>
